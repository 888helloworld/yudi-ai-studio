<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="xhs-analytics-endpoint" content="/api/events">
  <title>注册 · 御弟哥哥</title>
  <link rel="stylesheet" href="style.css?v=20260818">
  <style>
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-shell { display: flex; width: min(800px,100%); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; }
    .auth-aside { width: 320px; flex-shrink: 0; background:#000; padding:40px 32px; display:flex; flex-direction:column; justify-content:center; gap:16px; border-right:1px solid #000; }
    .auth-aside .eyebrow { color:rgba(255,255,255,.6); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
    .auth-aside h1 { font-size:24px; font-weight:700; line-height:1.35; color:#fff; max-width:100%; letter-spacing:0; }
    .auth-aside p { color:rgba(255,255,255,.75); font-size:14px; line-height:1.8; }
    .auth-card { flex: 1; padding: 40px 36px; display: flex; flex-direction: column; justify-content: center; }
    .auth-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .auth-card > p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
    .auth-card .form-group { margin-bottom: 18px; }
    .auth-card label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .auth-card input { width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 15px; outline: none; transition: var(--base); }
    .auth-card input:focus { border-color: var(--neon-pink); box-shadow: 0 0 0 3px rgba(7,193,96,0.15); }
    .auth-card input::placeholder { color: var(--text-dim); }
    .auth-card .hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .auth-card .policy-consent { display:flex; align-items:flex-start; gap:9px; margin:2px 0 18px; color:var(--text-secondary); font-size:12px; line-height:1.6; }
    .auth-card .policy-consent input { width:16px; height:16px; margin-top:2px; flex:0 0 auto; accent-color:var(--neon-pink); }
    .auth-card .policy-consent a { color:var(--neon-cyan); text-decoration:underline; text-underline-offset:2px; }
    .auth-card .btn { width: 100%; padding: 13px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px; background: linear-gradient(135deg, var(--neon-pink), #059050); color: #fff; border: none; cursor: pointer; transition: var(--base); box-shadow: 0 4px 16px rgba(7,193,96,0.25); }
    .auth-card .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(7,193,96,0.35); }
    .auth-card .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-card .error { display: none; color: var(--neon-red); background: rgba(250,81,81,0.1); border: 1px solid rgba(250,81,81,0.2); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
    .auth-card .success { display: none; color: var(--neon-green); background: rgba(7,193,96,0.1); border: 1px solid rgba(7,193,96,0.2); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
    .auth-card .links { text-align: center; margin-top: 20px; }
    .auth-card .links a { color: var(--neon-cyan); font-size: 14px; font-weight: 600; transition: var(--fast); }
    .auth-card .links a:hover { color: var(--neon-pink); }
    .auth-card .back-link { text-align: center; margin-top: 12px; }
    .auth-card .back-link a { color: var(--text-muted); font-size: 13px; transition: var(--fast); }
    .auth-card .back-link a:hover { color: var(--text-primary); }
    @media (max-width: 640px) {
      .auth-aside { display: none; }
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-aside">
      <div>
        <p class="eyebrow">Start Creating</p>
        <h1>给每条笔记一个更好的开头。</h1>
      </div>
      <p>注册完成后默认赠送 1000 积分，可用于图片生成、文案生成和改写。实际赠送值以部署配置为准。</p>
    </section>

    <section class="auth-card">
      <h2>创建账号</h2>
      <p>注册后即可进入创作台。</p>

      <div class="success" id="success">注册成功，即将跳转到登录页...</div>
      <div class="error" id="error"></div>

      <form id="registerForm">
        <div class="form-group" id="inviteGroup">
          <label for="inviteCode">邀请码 <span style="color:var(--neon-pink)">*</span></label>
          <input type="text" id="inviteCode" placeholder="请输入邀请码" required autocomplete="off">
          <p class="hint">需要邀请码才能注册，请联系管理员获取。</p>
        </div>
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" placeholder="3-20 个字符" required minlength="3" maxlength="20" autocomplete="username">
          <p class="hint">用户名长度为 3-20 个字符，不要使用控制字符；用户名区分大小写。</p>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="至少 8 个字符，包含大小写字母和数字" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入密码" required autocomplete="new-password">
        </div>
        <label class="policy-consent" for="policyConsent">
          <input type="checkbox" id="policyConsent" required>
          <span>我已阅读并同意 <a href="terms.html" target="_blank" rel="noopener">《服务条款》</a>、<a href="privacy.html" target="_blank" rel="noopener">《隐私政策》</a> 和 <a href="content-policy.html" target="_blank" rel="noopener">《内容规范》</a>（版本：2026-08-26-v1）。</span>
        </label>
        <button type="submit" class="btn" id="submitBtn">注册</button>
      </form>

      <div class="links">
        <a href="login.html" id="loginLink">已有账号？立即登录</a>
      </div>
      <div class="back-link">
        <a href="index.html">返回首页</a>
      </div>
    </section>
  </main>

<script src="register.js"></script>
</body>
</html>
