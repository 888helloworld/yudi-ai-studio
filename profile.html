<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 雨滴AI</title>
  <link rel="stylesheet" href="style.css?v=20260818">
  <style>
    .profile-body { min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); }
    .profile-body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(7,193,96,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(7,193,96,0.03)1px,transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 0; }
    .profile-body::after { content: ''; position: fixed; top: -300px; left: 50%; transform: translateX(-50%); width: 800px; height: 600px; background: radial-gradient(ellipse,rgba(7,193,96,0.08)0%,transparent 70%); pointer-events: none; z-index: 0; }
    .profile-nav { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,0.85); border-bottom: 1px solid var(--border); backdrop-filter: blur(20px); }
    .profile-nav-inner { width: min(1000px,calc(100% - 48px)); margin: 0 auto; min-height: 64px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
    .profile-nav h1 { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); -webkit-background-clip:border-box; -webkit-text-fill-color:currentColor; background-clip:border-box; }
    .profile-nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); transition: var(--base); }
    .profile-nav a:hover { color: var(--text-primary); background: var(--bg-card); }
    .profile-container { position: relative; z-index: 1; width: min(1080px,calc(100% - 48px)); margin: 0 auto; padding: 32px 0 48px; }
    .profile-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    .profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
    .profile-card.profile-wide { grid-column: 1 / -1; }
    .profile-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .profile-stats { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; margin-bottom: 24px; }
    .profile-stat { text-align: center; padding: 16px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border); }
    .profile-stat.balance { text-align: left; background: linear-gradient(135deg, rgba(7,193,96,0.14), rgba(7,193,96,0.08)); border-color: rgba(7,193,96,0.28); }
    .profile-stat-value { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); -webkit-background-clip:border-box; -webkit-text-fill-color:currentColor; background-clip:border-box; }
    .profile-stat-label { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .profile-form-group { margin-bottom: 16px; }
    .profile-form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .profile-form-group input { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; transition: var(--base); }
    .profile-form-group input:focus { border-color: var(--neon-pink); box-shadow: 0 0 0 3px rgba(7,193,96,0.15); }
    .profile-form-group input::placeholder { color: var(--text-dim); }
    .profile-btn { padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; background: linear-gradient(135deg, var(--neon-pink), #059050); color: #fff; border: none; cursor: pointer; transition: var(--base); box-shadow: 0 4px 12px rgba(7,193,96,0.25); }
    .profile-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(7,193,96,0.35); }
    .profile-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .profile-msg { display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; }
    .profile-msg.success { display: block; color: var(--neon-green); background: rgba(7,193,96,0.1); border: 1px solid rgba(7,193,96,0.2); }
    .profile-msg.error { display: block; color: var(--neon-red); background: rgba(250,81,81,0.1); border: 1px solid rgba(250,81,81,0.2); }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .log-table th, .log-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .log-table th { color: var(--text-muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .log-table tr:hover td { background: rgba(7,193,96,0.03); }
    .log-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .log-type.recharge { color: var(--neon-green); background: rgba(7,193,96,0.1); }
    .log-type.consume { color: var(--neon-red); background: rgba(250,81,81,0.1); }
    .log-amount { font-weight: 700; }
    .log-amount.positive { color: var(--neon-green); }
    .log-amount.negative { color: var(--neon-red); }
    .log-empty { text-align: center; color: var(--text-muted); padding: 32px; }
    .log-pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .log-pager-left, .log-pager-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .log-pager label, .log-page-info { color: var(--text-muted); font-size: 12px; font-weight: 700; }
    .log-pager select { width: auto; min-width: 82px; padding: 7px 28px 7px 10px; border-radius: var(--radius-sm); font-size: 13px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); }
    .log-page-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-surface); color: var(--text-secondary); font-size: 13px; font-weight: 700; cursor: pointer; transition: var(--base); }
    .log-page-btn:hover:not(:disabled) { border-color: var(--neon-pink); color: var(--neon-pink); }
    .log-page-btn:disabled { opacity: .45; cursor: not-allowed; }
    .account-summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin-bottom: 16px; }
    .account-summary-item { padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); min-width: 0; }
    .account-summary-label { color: var(--text-muted); font-size: 11px; font-weight: 800; margin-bottom: 6px; }
    .account-summary-value { color: var(--text-primary); font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .account-header h2 { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
    .account-header-note { color: var(--text-muted); font-size: 12px; line-height: 1.6; margin-top: 4px; }
    .account-quick-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .account-quick-actions .profile-btn { min-height: 34px; padding: 8px 12px; font-size: 12px; box-shadow: none; }
    .account-quick-actions .profile-btn.secondary, .account-quick-actions .profile-btn.secondary:hover { color: #fff; }
    .account-workspace { margin-top: 18px; }
    .profile-tabs { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; padding: 8px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px; }
    .profile-tab { width: 100%; min-height: 42px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 800; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; background: transparent; transition: var(--base); text-align: center; white-space: nowrap; }
    .profile-tab:hover { color: var(--text-primary); background: var(--bg-card); }
    .profile-tab.active { color: #fff; background: linear-gradient(135deg, var(--neon-pink), #059050); border-color: transparent; box-shadow: 0 4px 12px rgba(7,193,96,0.24); }
    .account-content { min-width: 0; padding: 18px; background: rgba(15,20,33,0.45); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .profile-tab-content { display: none; }
    .profile-tab-content.active { display: block; }
    .invite-panel { display: grid; gap: 14px; }
    .invite-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .invite-note { color: var(--text-muted); font-size: 12px; line-height: 1.6; }
    .invite-list { display: grid; gap: 10px; }
    .invite-item { display: grid; gap: 10px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .invite-main { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .invite-code { font-size: 16px; font-weight: 900; color: var(--neon-cyan); letter-spacing: .04em; }
    .invite-meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .invite-status { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .invite-status.unused { color: var(--neon-green); background: rgba(7,193,96,0.1); }
    .invite-status.used { color: var(--text-muted); background: rgba(148,163,184,0.12); }
    .invite-copy-row { display: flex; gap: 8px; align-items: center; }
    .invite-link { flex: 1; min-width: 0; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-btn.secondary { background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border); box-shadow: none; }
    .profile-btn.secondary:hover { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 0 3px rgba(7,193,96,0.12); }
    .redeem-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .profile-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .profile-badge.paid, .profile-badge.success { color: var(--neon-green); background: rgba(7,193,96,0.1); }
    .profile-badge.pending { color: #FAB702; background: rgba(250,183,2,0.1); }
    .profile-badge.closed { color: var(--text-muted); background: rgba(148,163,184,0.12); }
    .order-list { display: grid; gap: 10px; }
    .order-item { display: grid; gap: 8px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .order-main { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .order-no { color: var(--neon-cyan); font-family: "Courier New", monospace; font-size: 12px; font-weight: 800; }
    .order-meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--text-muted); font-size: 12px; }
    @media (max-width: 768px) {
      .profile-stats { grid-template-columns: repeat(2,1fr); }
      .account-summary { grid-template-columns: 1fr; }
      .account-header { flex-direction: column; gap: 8px; }
      .account-quick-actions { width: 100%; justify-content: stretch; }
      .account-quick-actions .profile-btn { flex: 1; justify-content: center; }
      .profile-tabs { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .redeem-row { grid-template-columns: 1fr; }
      .invite-copy-row { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body class="profile-body">
  <nav class="profile-nav">
    <div class="profile-nav-inner">
      <h1>个人中心</h1>
      <div>
        <span id="profileUserName" style="color:var(--neon-cyan);font-weight:700;font-size:14px;margin-right:12px;"></span>
        <a href="index.html">返回首页</a>
        <a href="#" id="logoutBtn">退出</a>
      </div>
    </div>
  </nav>

  <main class="profile-container">
    <div class="profile-stats" id="statsContainer">
      <div class="profile-stat balance"><div class="profile-stat-value" id="statBalance">-</div><div class="profile-stat-label">剩余积分</div></div>
      <div class="profile-stat"><div class="profile-stat-value" id="statImages">-</div><div class="profile-stat-label">生成图片</div></div>
      <div class="profile-stat"><div class="profile-stat-value" id="statCopies">-</div><div class="profile-stat-label">生成文案</div></div>
      <div class="profile-stat"><div class="profile-stat-value" id="statCost">-</div><div class="profile-stat-label">消耗积分</div></div>
      <div class="profile-stat"><div class="profile-stat-value" id="statRecharge">-</div><div class="profile-stat-label">获得积分</div></div>
    </div>

    <div class="profile-grid">
      <div class="profile-card">
        <div class="account-header">
          <div>
            <h2>账号设置</h2>
            <div class="account-header-note">管理密码、积分兑换、订单和邀请入口</div>
          </div>
          <div class="account-quick-actions">
            <a class="profile-btn secondary" href="index.html">购买积分</a>
            <a class="profile-btn secondary" href="help.html">查看帮助</a>
          </div>
        </div>
        <div class="account-summary">
          <div class="account-summary-item">
            <div class="account-summary-label">用户名</div>
            <div class="account-summary-value" id="accountUsername">-</div>
          </div>
          <div class="account-summary-item">
            <div class="account-summary-label">账号身份</div>
            <div class="account-summary-value" id="accountRole">-</div>
          </div>
          <div class="account-summary-item">
            <div class="account-summary-label">注册时间</div>
            <div class="account-summary-value" id="accountCreatedAt">-</div>
          </div>
        </div>
        <div class="account-workspace">
      <div class="profile-tabs" role="tablist" aria-label="账户功能">
        <button class="profile-tab active" type="button" role="tab" aria-selected="true" aria-controls="passwordTab" data-tab="password">修改密码</button>
        <button class="profile-tab" type="button" role="tab" aria-selected="false" aria-controls="redeemTab" tabindex="-1" data-tab="redeem">卡密兑换</button>
        <button class="profile-tab" type="button" role="tab" aria-selected="false" aria-controls="ordersTab" tabindex="-1" data-tab="orders">支付订单</button>
        <button class="profile-tab" type="button" role="tab" aria-selected="false" aria-controls="inviteTab" tabindex="-1" data-tab="invite">邀请注册</button>
          </div>
          <div class="account-content">
      <form class="profile-tab-content active" id="passwordTab" role="tabpanel">
              <div class="profile-msg" id="pwMsg"></div>
              <input type="text" id="passwordUsername" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;opacity:0;">
              <div class="profile-form-group">
                <label for="oldPassword">当前密码</label>
                <input type="password" id="oldPassword" placeholder="输入当前密码" maxlength="128" autocomplete="current-password">
              </div>
              <div class="profile-form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少8位，需含大小写字母和数字" minlength="8" maxlength="128" autocomplete="new-password">
              </div>
              <div class="profile-form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" maxlength="128" autocomplete="new-password">
              </div>
              <button class="profile-btn" id="changePwBtn" type="submit">修改密码</button>
            </form>
      <div class="profile-tab-content" id="redeemTab" role="tabpanel" hidden>
              <div class="profile-msg" id="redeemMsg"></div>
              <div class="redeem-row">
                <div class="profile-form-group" style="margin-bottom:0;">
                  <label for="redeemCode">卡密兑换码</label>
                  <input type="text" id="redeemCode" placeholder="输入管理员发放的卡密">
                </div>
                <button class="profile-btn" id="redeemBtn" type="button">兑换积分</button>
              </div>
              <p class="invite-note" style="margin-top:12px;">卡密只能使用一次，兑换成功后积分会立即进入余额，并写入积分明细。</p>
            </div>
      <div class="profile-tab-content" id="ordersTab" role="tabpanel" hidden>
              <div class="order-list" id="ordersList">
                <div class="log-empty">加载中...</div>
              </div>
            </div>
      <div class="profile-tab-content" id="inviteTab" role="tabpanel" hidden>
              <div class="profile-msg" id="inviteMsg"></div>
              <div class="invite-panel">
                <div class="invite-actions">
                  <button class="profile-btn" id="generateInviteBtn" type="button">生成邀请码</button>
                  <span class="invite-note">每个邀请码只能注册 1 个新账号，新用户注册后会收到赠送积分。</span>
                </div>
                <div class="invite-list" id="inviteList">
                  <div class="log-empty">加载中...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="profile-card">
        <h2>积分明细</h2>
        <div id="logsContainer">
          <div class="log-empty">加载中...</div>
        </div>
      </div>

    </div>
  </main>

    <script src="frontend/shared-utils.js?v=20260826"></script>
    <script src="profile.js?v=20260826"></script>
</body>
</html>
